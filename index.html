          mutate(() => { tpl.steps.splice(tpl.steps.indexOf(s), 1); const nx = tpl.steps[Math.min(i, tpl.steps.length - 1)]; view.setupSel = nx ? nx.id : null; });
        }, false, 'danger'))),
    h('div', { class: 'ed-body' },
      h('label', { class: 'field' }, h('span', { class: 'field-label' }, 'Step title'),
        h('input', { type: 'text', class: 'title-input', placeholder: 'e.g. Kick-off meeting', value: s.topic, autocomplete: 'off',
          dataset: { fk: `s-${s.id}-topic` }, oninput: e => setTitle(e.target.value) })),
      h('label', { class: 'field' }, h('span', { class: 'field-label' }, 'Instructions'),
        h('textarea', { rows: 3, value: s.note, placeholder: 'What should the person do in this step? (optional)', dataset: { fk: `s-${s.id}-note` },
          oninput: e => { s.note = e.target.value; touchSetup(); } }),
        h('span', { class: 'field-hint' }, 'Shown at the top of the step on the Work page, and as a hint in the notes box.')),
      section('checks', 'To-do list', s.todos.length,
        s.todos.length ? s.todos.map((t, j) => todoEditor(s, t, j)) : h('div', { class: 'none-yet' }, 'No to-do items yet.'),
        btn([icon('plus'), 'Add to-do'], () => mutate(() => { const t = blankTodo(); s.todos.push(t); view.focusNext = `t-${t.id}-label`; }), 'sm')),
      section('file', 'Documentation', s.docs.length,
        s.docs.length ? s.docs.map((l, j) => linkEditor(s.docs, l, j, 'doc')) : h('div', { class: 'none-yet' }, 'No documentation links.'),
        btn([icon('plus'), 'Add link'], () => mutate(() => { const l = blankLink('dl'); s.docs.push(l); view.focusNext = `l-${l.id}-label`; }), 'sm')),
      section('form', 'Forms', s.forms.length,
        s.forms.length ? s.forms.map((l, j) => linkEditor(s.forms, l, j, 'form')) : h('div', { class: 'none-yet' }, 'No form links.'),
        btn([icon('plus'), 'Add form'], () => mutate(() => { const l = blankLink('fl'); s.forms.push(l); view.focusNext = `l-${l.id}-label`; }), 'sm'))));
}

function todoEditor(s, t, j) {
  const n = s.todos.length;
  const word = t.type === 'multitext' ? 'Box' : 'Option';
  const markIc = t.type === 'multi' ? 'box' : t.type === 'single' ? 'circle' : t.type === 'multitext' ? 'text' : null;
  return h('div', { class: 'te' },
    h('div', { class: 'te-main' },
      h('span', { class: 'te-num' }, j + 1),
      h('input', { type: 'text', placeholder: 'To-do or question', value: t.label, autocomplete: 'off', 'aria-label': 'To-do label',
        dataset: { fk: `t-${t.id}-label` }, oninput: e => { t.label = e.target.value; touchSetup(); } }),
      h('select', { 'aria-label': 'Answer type', value: t.type, onchange: e => mutate(() => {
        t.type = e.target.value;
        if (hasOptions(t.type) && !t.options.length) t.options = t.type === 'multitext' ? ['Box 1', 'Box 2'] : ['Option 1', 'Option 2'];
      }) }, Object.entries(TYPES).map(([k, v]) => h('option', { value: k }, v))),
      h('label', { class: 'switch' },
        h('input', { type: 'checkbox', class: 'sr', checked: t.required, onchange: e => { t.required = e.target.checked; touchSetup(); } }),
        h('span', { class: 'track', 'aria-hidden': 'true' }), 'Required'),
      h('div', { class: 'btn-row tight' },
        ibtn('up', 'Move to-do up', () => mutate(() => move(s.todos, j, j - 1)), j === 0),
        ibtn('down', 'Move to-do down', () => mutate(() => move(s.todos, j, j + 1)), j === n - 1),
        ibtn('trash', 'Delete to-do', () => mutate(() => s.todos.splice(j, 1)), false, 'danger'))),
    hasOptions(t.type) ? h('div', { class: 'te-opts' },
      t.options.map((o, k) => h('div', { class: 'opt' },
        h('span', { class: 'opt-mark' }, markIc ? icon(markIc) : `${k + 1}.`),
        h('input', { type: 'text', value: o, placeholder: `${word} ${k + 1}`, autocomplete: 'off', 'aria-label': `${word} ${k + 1}`,
          dataset: { fk: `o-${t.id}-${k}` }, oninput: e => { t.options[k] = e.target.value; touchSetup(); } }),
        ibtn('x', 'Remove ' + word.toLowerCase(), () => mutate(() => t.options.splice(k, 1)), false, 'danger'))),
      h('div', {}, btn([icon('plus'), 'Add ' + word.toLowerCase()],
        () => mutate(() => { t.options.push(''); view.focusNext = `o-${t.id}-${t.options.length - 1}`; }), 'sm ghost'))) : null);
}

function linkEditor(list, l, j, kind) {
  return h('div', { class: 'le' },
    h('span', { class: 'le-ic' }, icon(kind === 'doc' ? 'file' : 'form')),
    h('input', { type: 'text', placeholder: 'Label', value: l.label, autocomplete: 'off', 'aria-label': 'Link label',
      dataset: { fk: `l-${l.id}-label` }, oninput: e => { l.label = e.target.value; touchSetup(); } }),
    h('input', { type: 'text', placeholder: 'Link (SharePoint, company page, file…)', value: l.url, autocomplete: 'off',
      spellcheck: 'false', autocapitalize: 'off', 'aria-label': 'Link', dataset: { fk: `l-${l.id}-url` },
      oninput: e => { l.url = e.target.value; touchSetup(); } }),
    ibtn('trash', 'Remove link', () => mutate(() => list.splice(j, 1)), false, 'danger'));
}

/* ───────────── PAGE 2: WORK ───────────── */
function renderWork() {
  const p = openProjectObj();
  $('#page-work').replaceChildren(...(p ? projectView(p) : workHome()));
  // On narrow screens the stepper scrolls sideways: keep the selected step visible.
  const sp = $('#page-work .stepper'), sel = $('#page-work .sp-item.sel');
  if (sp && sel && sp.scrollWidth > sp.clientWidth) sp.scrollLeft = Math.max(0, sel.offsetLeft - sp.offsetLeft - 8);
}

function workHome() {
  const nameIn = h('input', { type: 'text', id: 'npName', placeholder: 'e.g. ACME onboarding', autocomplete: 'off', dataset: { fk: 'np-name' } });
  const tplSel = h('select', { id: 'npTpl', value: state.activeSetupId },
    state.setups.map(s => h('option', { value: s.id }, `${s.name} (${s.steps.length} steps)`)));
  const create = () => {
    const name = nameIn.value.trim().slice(0, 200);
    if (!name) { toast('Enter a project name.', 'error'); nameIn.focus(); return; }
    const tpl = state.setups.find(s => s.id === tplSel.value);
    if (!tpl) { toast('Choose a setup template.', 'error'); return; }
    if (!tpl.steps.length) { toast('That setup has no steps yet. Add steps on the Setup page first.', 'error'); return; }
    const p = newProject(name, tpl);
    state.projects.push(p);
    saveProjects();
    openProject(p.id);
  };
  nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') create(); });

  const projects = [...state.projects].sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  return [
    pageHead('Projects', `${projects.length} project${projects.length === 1 ? '' : 's'} in this browser`,
      [btn([icon('folder'), 'Open project file'], () => $('#fileProject').click())]),
    h('section', { class: 'panel' },
      h('div', { class: 'panel-head' }, h('h3', {}, 'Start a new project')),
      h('div', { class: 'panel-body new-proj' },
        h('label', { class: 'field', for: 'npName' }, h('span', { class: 'field-label' }, 'Project name'), nameIn),
        h('label', { class: 'field', for: 'npTpl' }, h('span', { class: 'field-label' }, 'Setup template'), tplSel),
        btn([icon('plus'), 'Create project'], create, 'primary'))),
    h('section', { class: 'panel' },
      projects.length ? [
        h('div', { class: 'pt-head' }, h('span', {}, 'Project'), h('span', {}, 'Progress'), h('span', {}, 'Last updated'), h('span', {})),
        projects.map(projectRow)
      ] : h('div', { class: 'empty' }, h('div', { class: 'empty-ic' }, icon('checks')), h('h3', {}, 'No projects yet'),
        'Create one above, or open a saved project file.'))
  ];
}

function projectRow(p) {
  const n = p.template.steps.length, d = doneCount(p);
  const stop = fn => e => { e.stopPropagation(); fn(); };
  return h('div', { class: 'pt-row', onclick: () => openProject(p.id) },
    h('div', {},
      h('button', { class: 'pt-name', type: 'button', onclick: stop(() => openProject(p.id)) }, p.name),
      h('div', { class: 'pt-sub' }, p.template.name)),
    h('div', { class: 'pt-prog' },
      h('div', { class: 'pt-prog-top' }, h('span', {}, `${d}/${n} steps`),
        p.completedAt ? h('span', { class: 'chip ok' }, icon('check'), 'Complete') : h('span', { class: 'chip accent' }, 'In progress')),
      progressBar(d, n, 'sm')),
    h('div', { class: 'pt-date' }, fmtDateTime(p.updatedAt)),
    h('div', { class: 'pt-actions btn-row tight' },
      ibtn('edit', 'Rename', stop(() => renameProject(p))),
      ibtn('copy', 'Duplicate', stop(() => duplicateProject(p))),
      ibtn('trash', 'Delete', stop(() => deleteProject(p)), false, 'danger'),
      ibtn('chevR', 'Open', stop(() => openProject(p.id)))));
}

// The step to work on now: the first unlocked step that isn't done.
function currentIdx(p) {
  const steps = p.template.steps;
  for (let i = 0; i <= p.revealedUpTo; i++) if (p.steps[steps[i].id].status !== 'done') return i;
  return p.revealedUpTo;
}
const previewOpen = p => view.previewKey === p.id + ':' + p.revealedUpTo && p.revealedUpTo < p.template.steps.length - 1;
function selectedIdx(p) {
  const i = p.template.steps.findIndex(s => s.id === view.sel[p.id]);
  if (i >= 0 && (i <= p.revealedUpTo || (i === p.revealedUpTo + 1 && previewOpen(p)))) return i;
  return currentIdx(p);
}
function selectStep(p, i) { view.sel[p.id] = p.template.steps[i].id; view.scrollToPanel = true; render(); }
const reqStats = (s, st) => {
  const req = s.todos.filter(t => t.required);
  return { total: req.length, done: req.filter(t => todoDone(t, st.answers[t.id])).length };
};

function projectView(p) {
  const steps = p.template.steps, n = steps.length, d = doneCount(p);
  const si = selectedIdx(p);
  view.sel[p.id] = steps[si].id; // keep showing this step until the user (or a finished click) moves on
  const isPreview = si > p.revealedUpTo;
  const head = h('div', {},
    h('button', { class: 'crumb', type: 'button', onclick: closeProject }, icon('chevL'), 'All projects'),
    h('div', { class: 'proj-top' },
      h('div', {},
        h('h1', {}, p.name),
        h('div', { class: 'proj-meta' }, h('span', {}, p.template.name), h('span', {}, '·'), h('span', {}, `Started ${fmtDateTime(p.createdAt)}`))),
      h('div', { class: 'btn-row' },
        btn([icon('list'), 'Summary'], () => { state.ui.tab = 'summary'; saveUi(); render(); window.scrollTo(0, 0); }),
        ibtn('edit', 'Rename project', () => renameProject(p), false, 'bordered'),
        btn([icon('folder'), 'Open file'], () => $('#fileProject').click()),
        btn([icon('save'), 'Save project'], () => saveProjectFile(p), 'primary'))),
    h('div', { class: 'panel progress-card' },
      h('div', { class: 'progress-top' }, h('span', {}, `Step ${d} of ${n} complete`), h('span', { class: 'pct' }, Math.round(d / n * 100) + '%')),
      progressBar(d, n)));

  return [head, h('div', { class: 'split' },
    h('aside', { class: 'panel sticky-side', 'aria-label': 'Steps' }, stepper(p, si)),
    h('div', {},
      p.completedAt ? h('div', { class: 'done-banner', role: 'status' }, h('span', { class: 'ic' }, icon('flag')),
        h('div', {}, h('strong', {}, 'Project complete'), `Finished ${fmtDateTime(p.completedAt)}`)) : null,
      stepPanel(p, si, isPreview)))];
}

function stepper(p, si) {
  const steps = p.template.steps, r = p.revealedUpTo, n = steps.length, cur = currentIdx(p);
  const open = previewOpen(p);
  const item = (i, preview) => {
    const s = steps[i], st = p.steps[s.id];
    const state_ = preview ? 's-locked' : st.status === 'done' ? 's-done' : i === cur ? 's-current' : 's-open';
    const rs = reqStats(s, st);
    const sub = preview ? 'Locked · preview'
      : st.status === 'done' ? `Done${st.completedAt ? ' · ' + fmtTime(st.completedAt) : ''}`
      : rs.total ? `${rs.done} of ${rs.total} required done` : 'In progress';
    const lineDone = st.status === 'done' && !preview && i < r;
    return h('li', { class: `sp-item ${state_}` + (i === si ? ' sel' : '') + (lineDone ? ' line-done' : '') },
      h('button', { class: 'sp-btn', type: 'button', 'aria-current': i === si ? 'step' : null, onclick: () => selectStep(p, i) },
        h('span', { class: 'circle' }, preview ? icon('lock') : st.status === 'done' ? icon('check') : i + 1),
        h('span', { class: 'sp-text' }, h('span', { class: 'sp-title' }, s.topic || 'Untitled step'), h('span', { class: 'sp-sub' }, sub))));
  };
  const items = [];
  for (let i = 0; i <= r; i++) items.push(item(i, false));
  if (r < n - 1) {
    if (open) items.push(item(r + 1, true));
    items.push(h('li', { class: 'sp-more' },
      h('button', { class: 'add-preview', type: 'button', 'aria-expanded': String(open),
        onclick: () => {
          if (open) { view.previewKey = null; if (si === r + 1) delete view.sel[p.id]; render(); }
          else { view.previewKey = p.id + ':' + r; selectStep(p, r + 1); }
        } },
        h('span', { class: 'plus' }, icon(open ? 'x' : 'plus')), open ? 'Hide preview' : 'Preview next step')));
    const hidden = n - r - 1 - (open ? 1 : 0);
    if (hidden > 0) items.push(h('li', { class: 'locked-count' }, `${hidden} more step${hidden === 1 ? '' : 's'} locked`));
  }
  return h('ol', { class: 'stepper' }, items);
}

function stepPanel(p, i, preview) {
  const steps = p.template.steps, s = steps[i], st = p.steps[s.id], n = steps.length, r = p.revealedUpTo;
  const done = st.status === 'done' && !preview;
  const rs = reqStats(s, st);
  const chip = preview ? h('span', { class: 'chip' }, icon('lock'), 'Locked')
    : done ? h('span', { class: 'chip ok' }, icon('check'), 'Done')
    : h('span', { class: 'chip accent' }, 'In progress');

  // Footer navigation
  let next;
  if (preview) next = h('span', { class: 'foot-hint' }, icon('lock'), `Complete step ${r + 1} to unlock`);
  else if (i < r) next = btn(['Next step', icon('chevR')], () => selectStep(p, i + 1), done ? 'primary' : '');
  else if (i < n - 1) next = h('span', { class: 'foot-hint' }, icon('lock'), 'Finish the required items to unlock the next step');
  else next = p.completedAt ? h('span', { class: 'chip ok' }, icon('flag'), 'All steps complete') : h('span', { class: 'foot-hint' }, 'Last step');

  return h('section', { class: 'panel step-panel' + (preview ? ' preview' : ''), 'aria-label': `Step ${i + 1}: ${s.topic || 'Untitled step'}` },
    h('div', { class: 'hero' },
      h('div', { class: 'eyebrow' }, `Step ${i + 1} of ${n}`),
      h('div', { class: 'hero-row' },
        // Not clickable: ticks itself when all required to-do items are done.
        h('span', { class: 'tick' + (done ? ' on' : ''), role: 'checkbox', 'aria-checked': String(done), 'aria-disabled': 'true',
          'aria-label': done ? 'Step complete' : 'Step not complete', title: 'Ticks automatically when all required to-do items are done' }, icon('check')),
        h('h2', {}, s.topic || 'Untitled step'), chip)),
    preview ? h('div', { class: 'locked-note' }, icon('lock'), `Preview only — this step unlocks when step ${r + 1} is complete.`) : null,
    s.note.trim() ? h('div', { class: 'instruction' }, icon('info'), h('div', {}, h('div', { class: 't' }, 'Instructions'), h('p', {}, s.note))) : null,
    h('div', { class: 'sec' },
      h('div', { class: 'sec-head' }, h('h3', {}, icon('checks'), 'To-do list'),
        rs.total ? h('span', { class: 'sec-meta' + (rs.done === rs.total ? ' ok' : '') }, `${rs.done} of ${rs.total} required done`) : null),
      s.todos.length ? h('ul', { class: 'checklist' }, s.todos.map(t => todoRow(p, s, t, preview)))
        : h('div', { class: 'none-yet' }, 'No to-do items in this step.')),
    (s.docs.length || s.forms.length) ? h('div', { class: 'sec' },
      h('div', { class: 'sec-head' }, h('h3', {}, icon('link'), 'Documents & forms')),
      h('div', { class: 'res-grid' }, s.docs.map(l => resTile(l, 'doc')), s.forms.map(l => resTile(l, 'form')))) : null,
    h('div', { class: 'sec' },
      h('div', { class: 'sec-head' }, h('h3', {}, icon('note'), 'Notes')),
      h('textarea', { rows: 4, value: st.note, disabled: preview, autocomplete: 'off', 'aria-label': 'Notes for this step',
        placeholder: s.note.trim() || 'Write notes for this step…', dataset: { fk: `n-${p.id}-${s.id}` },
        oninput: e => { st.note = e.target.value; p.updatedAt = now(); saveProjects(); } })),
    h('div', { class: 'step-foot' },
      i > 0 ? btn([icon('chevL'), 'Previous'], () => selectStep(p, i - 1), 'ghost') : h('span', {}),
      next));
}

function resTile(l, kind) {
  // Links are used exactly as typed in Setup.
  const inner = [
    h('span', { class: 'res-ic ' + kind }, icon(kind === 'doc' ? 'file' : 'form')),
    h('span', { class: 'res-text' }, h('span', { class: 'res-label' }, l.label || l.url || '(no link)'),
      h('span', { class: 'res-kind' }, kind === 'doc' ? 'Documentation' : 'Form'))
  ];
  return l.url ? h('a', { class: 'res', href: l.url, target: '_blank', title: l.url }, inner, h('span', { class: 'res-go' }, icon('external')))
    : h('div', { class: 'res' }, inner);
}

function todoRow(p, s, t, disabled) {
  const st = p.steps[s.id];
  const a = st.answers[t.id];
  const done = todoDone(t, a);
  const label = t.label || '(untitled)';
  const req = t.required ? h('span', { class: 'req' }, 'Required') : null;
  const set = v => { st.answers[t.id] = v; answerChanged(p, s); };
  const cls = 'ci' + (done ? ' done' : '') + (disabled ? ' ro' : '');
  const noOpts = t.options.length ? null : h('div', { class: 'none-yet' }, t.type === 'multitext' ? '(no text boxes defined)' : '(no options defined)');
  const row = (...body) => h('li', { class: cls },
    h('span', { class: 'ci-dot', 'aria-hidden': 'true' }, icon('check')),
    h('div', { class: 'ci-body' }, h('div', { class: 'ci-head' }, h('span', { class: 'ci-label' }, label), req), ...body));
  const optChip = (type, on, text, onchange) => h('label', { class: 'opt-chip' + (on ? ' on' : '') },
    h('input', { type, class: 'sr', name: type === 'radio' ? `r-${p.id}-${t.id}` : null, checked: on, disabled, onchange }),
    h('span', { class: 'mk' + (type === 'radio' ? ' round' : ''), 'aria-hidden': 'true' }, type === 'radio' ? null : icon('check')), text);

  switch (t.type) {
    case 'checkbox':
      return h('li', { class: cls + ' check' },
        h('label', { class: 'ci-check' },
          h('input', { type: 'checkbox', class: 'sr', checked: a === true, disabled, onchange: e => set(e.target.checked) }),
          h('span', { class: 'box', 'aria-hidden': 'true' }, icon('check')),
          h('span', { class: 'ci-head' }, h('span', { class: 'ci-label' }, label), req)));
    case 'multi': {
      const cur = arr(a);
      return row(h('div', { class: 'chips', role: 'group', 'aria-label': label }, t.options.map(o => optChip('checkbox', cur.includes(o), o, e => {
        const sel = new Set(arr(st.answers[t.id]));
        e.target.checked ? sel.add(o) : sel.delete(o);
        set(t.options.filter(x => sel.has(x)));
      })), noOpts));
    }
    case 'single':
      return row(h('div', { class: 'chips', role: 'radiogroup', 'aria-label': label }, t.options.map(o => optChip('radio', a === o, o, () => set(o))), noOpts),
        a && !disabled ? h('button', { class: 'linkish', type: 'button', onclick: () => set('') }, 'Clear choice') : null);
    case 'dropdown':
      return row(h('select', { class: 'ci-select', value: a || '', disabled, 'aria-label': label, onchange: e => set(e.target.value) },
        h('option', { value: '' }, 'Select…'), t.options.map(o => h('option', { value: o }, o))));
    case 'multitext': {
      const cur = arr(a);
      return row(h('div', { class: 'mt-grid' }, t.options.map((o, k) => {
        const inp = h('input', { type: 'text', value: cur[k] || '', disabled, autocomplete: 'off', placeholder: o, dataset: { fk: `a-${p.id}-${t.id}-${k}` } });
        inp.addEventListener('input', e => { if (!e.isComposing) textChanged(p, s, t, inp, k); else st.answers[t.id][k] = inp.value; });
        inp.addEventListener('compositionend', () => textChanged(p, s, t, inp, k));
        return h('label', { class: 'field' }, h('span', { class: 'field-label' }, o), inp);
      }), noOpts));
    }
    default: { // short text
      const inp = h('input', { type: 'text', class: 'ci-text', value: a || '', disabled, autocomplete: 'off', placeholder: 'Type your answer',
        'aria-label': label, dataset: { fk: `a-${p.id}-${t.id}` } });
      // Don't redraw while an input method (IME, e.g. Thai) is composing; finish on compositionend.
      inp.addEventListener('input', e => { if (!e.isComposing) textChanged(p, s, t, inp); else st.answers[t.id] = inp.value; });
      inp.addEventListener('compositionend', () => textChanged(p, s, t, inp));
      return row(inp);
    }
  }
}

function afterStepChange(p, s, wasDone, advance) {
  const i = p.template.steps.indexOf(s);
  if (wasDone || p.steps[s.id].status !== 'done') return;
  if (p.completedAt) { toast('All steps complete — project finished!', 'ok'); return; }
  const cur = currentIdx(p);
  if (cur !== i && p.steps[p.template.steps[cur].id].status !== 'done') {
    if (advance) { view.sel[p.id] = p.template.steps[cur].id; view.scrollToPanel = true; }
    toast(advance ? `Step ${i + 1} complete — on to step ${cur + 1}.` : `Step ${i + 1} complete — click "Next step" to continue.`, 'ok');
  } else toast(`Step ${i + 1} complete.`, 'ok');
}
function answerChanged(p, s) {
  const wasDone = p.steps[s.id].status === 'done';
  recompute(p);
  p.updatedAt = now();
  saveProjects();
  afterStepChange(p, s, wasDone, true);
  render();
}
function textChanged(p, s, t, inp, k = null) {
  const st = p.steps[s.id];
  if (k == null) st.answers[t.id] = inp.value.slice(0, 5000);
  else st.answers[t.id][k] = inp.value.slice(0, 5000);
  const wasDone = st.status === 'done';
  const before = statusSig(p);
  recompute(p);
  p.updatedAt = now();
  saveProjects();
  if (statusSig(p) !== before) { afterStepChange(p, s, wasDone, false); render(); }
  else inp.closest('.ci').classList.toggle('done', todoDone(t, st.answers[t.id]));
}

function openProject(id) {
  state.ui.openProjectId = id;
  state.ui.tab = 'work';
  delete view.sel[id];
  view.previewKey = null;
  saveUi();
  render();
  window.scrollTo(0, 0);
}
function closeProject() {
  state.ui.openProjectId = null;
  saveUi(); render(); window.scrollTo(0, 0);
}

async function newSetup() {
  const name = await promptBox('New setup', 'Setup name', 'New setup', 'Create');
  if (!name) return;
  const t = blankSetup(name);
  state.setups.push(t);
  state.activeSetupId = t.id;
  saveSetups(); render();
}
async function dupSetup() {
  const src = activeSetup();
  const name = await promptBox('Duplicate setup', 'Name for the copy', src.name + ' (copy)', 'Duplicate');
  if (!name) return;
  const t = clone(src);
  t.id = uid('tpl'); t.name = name; t.updatedAt = now();
  state.setups.push(t);
  state.activeSetupId = t.id;
  saveSetups(); render();
}
async function renameSetup() {
  const t = activeSetup();
  const name = await promptBox('Rename setup', 'Setup name', t.name);
  if (!name) return;
  t.name = name;
  touchSetup(); render();
}
async function deleteSetup() {
  const t = activeSetup();
  if (!await confirmBox('Delete setup?', `Delete the setup "${t.name}"? Projects already created from it are not affected.`)) return;
  state.setups = state.setups.filter(x => x !== t);
  if (!state.setups.length) state.setups.push(blankSetup('My setup'));
  state.activeSetupId = state.setups[0].id;
  saveSetups(); render();
  toast(`Deleted setup "${t.name}".`);
}
function exportSetup() {
  const t = activeSetup();
  const out = normTemplate(clone(t)); // clean copy (drops empty options etc.)
  out.updatedAt = t.updatedAt;
  out.exportedAt = now();
  const name = fileSafe(t.name) + '.setup.json';
  download(name, JSON.stringify(out, null, 2));
  toast(`Exported "${name}".`, 'ok');
}
async function importSetupFile(file) {
  try {
    const t = normTemplate(await readJsonFile(file));
    const cur = activeSetup();
    const r = await modal({
      title: 'Import setup',
      message: `File: "${t.name}" — ${t.steps.length} step(s).\n\nReplace the current setup "${cur.name}" with it, or add it as a new setup?`,
      buttons: [{ label: 'Cancel', value: null }, { label: 'Add as new', value: 'new' }, { label: 'Replace current', value: 'replace', cls: 'danger solid' }]
    });
    if (!r) return;
    if (r.button === 'replace') {
      t.id = cur.id;
      state.setups[state.setups.indexOf(cur)] = t;
    } else {
      if (state.setups.some(s => s.id === t.id)) t.id = uid('tpl');
      state.setups.push(t);
    }
    t.updatedAt = now();
    state.activeSetupId = t.id;
    saveSetups(); render();
    toast(`Imported "${t.name}".`, 'ok');
  } catch (e) {
    toast('Could not import setup: ' + e.message, 'error');
  }
}


async function renameProject(p) {
  const name = await promptBox('Rename project', 'Project name', p.name);
  if (!name) return;
  p.name = name; p.updatedAt = now();
  saveProjects(); render();
}
function duplicateProject(p) {
  const c = clone(p);
  c.id = uid('prj'); c.name = p.name + ' (copy)'; c.updatedAt = now();
  state.projects.push(c);
  saveProjects(); render();
  toast(`Duplicated as "${c.name}".`, 'ok');
}
async function deleteProject(p) {
  if (!await confirmBox('Delete project?', `Delete "${p.name}" from this browser? Saved project files are not affected. This cannot be undone.`)) return;
  state.projects = state.projects.filter(x => x !== p);
  if (state.ui.openProjectId === p.id) state.ui.openProjectId = null;
  saveProjects(); saveUi(); render();
  toast(`Deleted "${p.name}".`);
}
function projectFileData(p) {
  return {
    kind: KIND_PROJECT, schemaVersion: SCHEMA, app: 'Step Workflow', savedAt: now(),
    id: p.id, name: p.name, createdAt: p.createdAt, updatedAt: p.updatedAt, completedAt: p.completedAt,
    revealedUpTo: p.revealedUpTo, template: clone(p.template), steps: clone(p.steps)
  };
}
async function saveProjectFile(p) {
  const r = await modal({
    title: 'Save project',
    message: 'The file downloads to your computer. It contains a full copy of the setup, all answers and notes, so it opens on any computer.',
    input: { label: 'File name', value: fileSafe(p.name) + '.json' },
    buttons: [{ label: 'Cancel', value: null }, { label: 'Download', value: 'ok', cls: 'primary' }]
  });
  if (!r) return;
  const name = fileSafe(r.value.trim().replace(/\.json$/i, '')) + '.json';
  download(name, JSON.stringify(projectFileData(p), null, 2));
  toast(`Saved "${name}" to your downloads.`, 'ok');
}
async function openProjectFile(file) {
  try {
    const p = normProject(await readJsonFile(file));
    const existing = state.projects.find(x => x.id === p.id);
    if (existing) {
      const r = await modal({
        title: 'Project already in this browser',
        message: `"${existing.name}" (updated ${fmtDateTime(existing.updatedAt)}) is already stored here.\nThe file version was updated ${fmtDateTime(p.updatedAt)}.`,
        buttons: [{ label: 'Cancel', value: null }, { label: 'Keep both', value: 'both' }, { label: 'Replace with file', value: 'replace', cls: 'danger solid' }]
      });
      if (!r) return;
      if (r.button === 'both') { p.id = uid('prj'); p.name += ' (from file)'; state.projects.push(p); }
      else state.projects[state.projects.indexOf(existing)] = p;
    } else {
      state.projects.push(p);
    }
    saveProjects();
    openProject(p.id);
    const n = p.template.steps.length;
    toast(p.completedAt ? `Opened "${p.name}" — project is complete.` : `Opened "${p.name}" — continuing at step ${p.revealedUpTo + 1} of ${n}.`, 'ok');
  } catch (e) {
    toast('Could not open project file: ' + e.message, 'error');
  }
}


/* ───────────── PAGE 3: SUMMARY ───────────── */
function answerText(t, a) {
  switch (t.type) {
    case 'checkbox': return a === true ? '✓ Done' : '✗ Not done';
    case 'multi': return Array.isArray(a) && a.length ? a.join(', ') : '';
    case 'multitext': return Array.isArray(a) && a.some(x => x.trim()) ? t.options.map((o, k) => `${o}: ${(a[k] || '').trim() || '—'}`).join('\n') : '';
    case 'text': return typeof a === 'string' ? a.trim() : '';
    default: return typeof a === 'string' ? a : '';
  }
}
function stepStatusText(st) {
  if (st.status === 'done') return st.completedAt ? `Done · ${fmtDateTime(st.completedAt)}` : 'Done';
  return st.status === 'active' ? 'In progress' : 'Not started';
}
function projectStatusText(p) {
  const n = p.template.steps.length;
  return p.completedAt ? `Complete — finished ${fmtDateTime(p.completedAt)}` : `In progress — step ${doneCount(p)} of ${n} complete`;
}


function summaryText(p) {
  const n = p.template.steps.length;
  const lines = [
    `Project: ${p.name}`,
    `Setup: ${p.template.name}`,
    `Started: ${fmtDateTime(p.createdAt)}`,
    `Last updated: ${fmtDateTime(p.updatedAt)}`,
    `Status: ${projectStatusText(p)}`,
    ''
  ];
  p.template.steps.forEach((s, i) => {
    const st = p.steps[s.id];
    lines.push(`${i + 1}. ${s.topic || 'Untitled step'} — ${stepStatusText(st)}`);
    if (view.summaryAnswers && st.status !== 'locked')
      s.todos.forEach(t => {
        const a = answerText(t, st.answers[t.id]) || '—';
        lines.push(`   - ${t.label || '(untitled)'}:` + (a.includes('\n') ? a.split('\n').map(l => '\n       ' + l).join('') : ' ' + a));
      });
    if (st.note.trim()) {
      lines.push('   Notes:');
      st.note.trim().split(/\r?\n/).forEach(l => lines.push('     ' + l));
    }
    lines.push('');
  });
  return lines.join('\n');
}
async function copySummary(p) {
  const text = summaryText(p);
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = h('textarea', { value: text, style: 'position:fixed;opacity:0' });
    document.body.append(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { /* ignore */ }
    ta.remove();
    if (!ok) { toast('Could not copy. Use "Download .txt" instead.', 'error'); return; }
  }
  toast('Summary copied — paste it into an email or document.', 'ok');
}

/* ───────────── Global wiring ───────────── */
async function clearAll() {
  if (!await confirmBox('Clear all data?', 'Delete every setup and project stored in this browser? Export setups and save project files first if you want to keep them. This cannot be undone.', 'Delete everything')) return;
  try { Object.values(LS).forEach(k => localStorage.removeItem(k)); } catch (e) { /* ignore */ }
  state.projects = [];
  state.setups = [sampleSetup()];
  state.activeSetupId = state.setups[0].id;
  state.ui.openProjectId = null;
  view.sel = {};
  view.setupSel = null;
  saveSetups(); saveProjects(); saveUi(); render();
  toast('All data in this browser was cleared. The sample setup was restored.', 'ok');
}


function renderSummary() {
  const root = $('#page-summary');
  if (!state.projects.length) {
    root.replaceChildren(pageHead('Summary', 'A read-only report of a project.'),
      h('div', { class: 'panel empty' }, h('div', { class: 'empty-ic' }, icon('list')), h('h3', {}, 'No projects yet'),
        'Create a project on the Work page, or open a project file there.'));
    return;
  }
  const p = openProjectObj();
  const projects = [...state.projects].sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  const sel = h('select', { id: 'sumSel', value: p ? p.id : '', 'aria-label': 'Project',
    onchange: e => { state.ui.openProjectId = e.target.value || null; view.previewKey = null; saveUi(); render(); } },
    p ? null : h('option', { value: '' }, 'Choose a project…'),
    projects.map(x => h('option', { value: x.id }, `${x.name} (${doneCount(x)}/${x.template.steps.length})`)));
  const bar = h('div', { class: 'panel sum-toolbar no-print' },
    h('label', { class: 'field-label', for: 'sumSel' }, 'Project'), sel,
    p ? h('label', { class: 'switch' },
      h('input', { type: 'checkbox', class: 'sr', checked: view.summaryAnswers, onchange: e => { view.summaryAnswers = e.target.checked; render(); } }),
      h('span', { class: 'track', 'aria-hidden': 'true' }), 'Show to-do answers') : null,
    p ? h('div', { class: 'btn-row', style: 'margin-left:auto' },
      btn([icon('copy'), 'Copy text'], () => copySummary(p)),
      btn([icon('download'), 'Download .txt'], () => {
        const name = fileSafe(p.name) + ' - summary.txt';
        download(name, summaryText(p), 'text/plain;charset=utf-8');
        toast(`Saved "${name}" to your downloads.`, 'ok');
      }),
      btn([icon('printer'), 'Print / PDF'], () => window.print(), 'primary')) : null);
  const head = h('div', { class: 'no-print' }, pageHead('Summary', 'A read-only report of the steps, answers and notes of a project.'));
  if (!p) { root.replaceChildren(head, bar); return; }

  const n = p.template.steps.length, d = doneCount(p);
  const doc = h('article', { class: 'panel sum-doc' },
    h('div', { class: 'eyebrow' }, 'Project summary'),
    h('h1', { style: 'margin-top:4px' }, p.name),
    h('dl', { class: 'sum-facts' },
      h('div', {}, h('dt', {}, 'Setup'), h('dd', {}, p.template.name)),
      h('div', {}, h('dt', {}, 'Started'), h('dd', {}, fmtDateTime(p.createdAt))),
      h('div', {}, h('dt', {}, 'Last updated'), h('dd', {}, fmtDateTime(p.updatedAt))),
      h('div', {}, h('dt', {}, 'Status'), h('dd', {}, p.completedAt ? `Complete · ${fmtDateTime(p.completedAt)}` : `In progress · ${d} of ${n} steps`))),
    h('div', { class: 'progress-top', style: 'margin-bottom:8px' }, h('span', {}, `Step ${d} of ${n} complete`), h('span', { class: 'pct' }, Math.round(d / n * 100) + '%')),
    progressBar(d, n),
    h('div', { style: 'margin-top:8px' }, p.template.steps.map((s, i) => {
      const st = p.steps[s.id];
      const stateCls = st.status === 'done' ? 's-done' : st.status === 'active' ? 's-current' : 's-locked';
      const chip = st.status === 'done' ? h('span', { class: 'chip ok' }, icon('check'), st.completedAt ? `Done · ${fmtDateTime(st.completedAt)}` : 'Done')
        : st.status === 'active' ? h('span', { class: 'chip accent' }, 'In progress') : h('span', { class: 'chip' }, icon('lock'), 'Not started');
      const showAnswers = view.summaryAnswers && st.status !== 'locked' && s.todos.length;
      return h('section', { class: 'sum-step ' + stateCls },
        h('div', { class: 'sum-step-head' },
          h('span', { class: 'circle' }, st.status === 'done' ? icon('check') : i + 1),
          h('h3', {}, s.topic || 'Untitled step'), chip),
        showAnswers ? h('div', { class: 'sum-answers' }, s.todos.map(t => {
          const txt = answerText(t, st.answers[t.id]);
          return [h('div', { class: 'q' }, t.label || '(untitled)', t.required ? h('span', { class: 'req-star', style: 'color:var(--danger)' }, ' *') : null),
            h('div', { class: 'a' + (txt ? '' : ' none') }, txt || '—')];
        })) : null,
        st.note.trim() ? h('div', { class: 'sum-note' }, h('div', { class: 't' }, 'Notes'), st.note)
          : st.status !== 'locked' ? h('div', { class: 'sum-note none' }, 'No notes.') : null);
    })));
  root.replaceChildren(head, bar, doc);
}

/* ───────────── Global wiring ───────────── */
function init() {
  document.querySelectorAll('[data-icon]').forEach(e => e.replaceChildren(icon(e.dataset.icon)));
  for (const t of ['setup', 'work', 'summary'])
    $('#tab-' + t).addEventListener('click', () => { state.ui.tab = t; saveUi(); render(); window.scrollTo(0, 0); });
  $('#themeBtn').addEventListener('click', () => {
    state.ui.theme = { auto: 'light', light: 'dark', dark: 'auto' }[state.ui.theme];
    saveUi(); applyTheme();
  });
  $('#clearAll').addEventListener('click', clearAll);
  $('#fileSetup').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importSetupFile(f); });
  $('#fileProject').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) openProjectFile(f); });
  // Keep several open tabs of this app in sync.
  window.addEventListener('storage', e => {
    if (e.key !== LS.setups && e.key !== LS.projects && e.key !== LS.active) return;
    loadData(); render();
  });
  window.addEventListener('error', e => toast('Something went wrong: ' + (e.message || 'unknown error'), 'error'));
  window.addEventListener('unhandledrejection', e => toast('Something went wrong: ' + ((e.reason && e.reason.message) || 'unknown error'), 'error'));

  loadUi();
  loadData();
  render();
}
init();
})();
</script>
</body>
</html>
