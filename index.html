<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Privacy: this page may not load or send anything over the network. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="color-scheme" content="light dark">
<title>Step Workflow</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f2f4f7; --surface-3: #e9ecf1;
  --text: #101828; --text-2: #344054; --muted: #667085; --border: #e4e7ec; --border-strong: #d0d5dd;
  --accent: #4f46e5; --accent-hover: #4338ca; --accent-text: #ffffff; --accent-soft: #eef0ff; --accent-line: #c7cbfb;
  --ok: #079455; --ok-strong: #067647; --ok-soft: #e7f8ef; --ok-line: #a6e6c4;
  --warn: #b54708; --warn-soft: #fff6e5; --warn-line: #fcd9a1;
  --danger: #d92d20; --danger-soft: #fef1f0;
  --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
  --shadow: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04);
  --shadow-lg: 0 12px 32px -6px rgba(16,24,40,.18);
  --r: 12px; --r-sm: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c111d; --surface: #141a26; --surface-2: #1b2230; --surface-3: #252d3c;
    --text: #f2f4f7; --text-2: #cfd4dc; --muted: #94a0b3; --border: #262f3f; --border-strong: #344054;
    --accent: #8191ff; --accent-hover: #9aa6ff; --accent-text: #0c111d; --accent-soft: #1d2342; --accent-line: #3b4380;
    --ok: #3ccb7f; --ok-strong: #47cd89; --ok-soft: #10291d; --ok-line: #1f5a3c;
    --warn: #fdb022; --warn-soft: #2e2210; --warn-line: #6b4a12;
    --danger: #f97066; --danger-soft: #34171a;
    --shadow-sm: none; --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 16px 40px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c111d; --surface: #141a26; --surface-2: #1b2230; --surface-3: #252d3c;
  --text: #f2f4f7; --text-2: #cfd4dc; --muted: #94a0b3; --border: #262f3f; --border-strong: #344054;
  --accent: #8191ff; --accent-hover: #9aa6ff; --accent-text: #0c111d; --accent-soft: #1d2342; --accent-line: #3b4380;
  --ok: #3ccb7f; --ok-strong: #47cd89; --ok-soft: #10291d; --ok-line: #1f5a3c;
  --warn: #fdb022; --warn-soft: #2e2210; --warn-line: #6b4a12;
  --danger: #f97066; --danger-soft: #34171a;
  --shadow-sm: none; --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 16px 40px rgba(0,0,0,.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", "Noto Sans Thai", "Leelawadee UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: 22px; line-height: 1.25; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 19px; line-height: 1.3; font-weight: 650; letter-spacing: -.01em; }
h3 { font-size: 15px; font-weight: 650; }
a { color: var(--accent); }
svg.i { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted { color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── App bar ── */
.appbar { position: sticky; top: 0; z-index: 30; background: var(--surface); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.appbar-in { max-width: 1240px; margin: 0 auto; height: 56px; padding: 0 24px; display: flex; align-items: center; gap: 24px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; white-space: nowrap; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; font-size: 16px; }
.nav { display: flex; gap: 2px; height: 100%; }
.nav-tab { display: inline-flex; align-items: center; gap: 8px; height: 100%; padding: 0 14px; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.nav-tab svg { font-size: 16px; }
.nav-tab:hover { color: var(--text); }
.nav-tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.appbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.saved { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.saved svg { color: var(--ok); font-size: 14px; }
.saved.bad, .saved.bad svg { color: var(--danger); }

.container { max-width: 1240px; margin: 0 auto; padding: 24px; }
.banner { max-width: 1192px; margin: 16px auto 0; border-radius: var(--r-sm); padding: 10px 14px; font-size: 13px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-line); }

/* ── Buttons & inputs ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; font: inherit; font-weight: 600; font-size: 13.5px;
  height: 36px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--surface);
  color: var(--text-2); cursor: pointer; white-space: nowrap; box-shadow: var(--shadow-sm); transition: background .12s, border-color .12s; }
.btn svg { font-size: 16px; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: var(--r-sm); border: 1px solid transparent;
  background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; }
.icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.icon-btn.danger:hover:not(:disabled) { background: var(--danger-soft); color: var(--danger); }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; }
.icon-btn.bordered { border-color: var(--border-strong); background: var(--surface); box-shadow: var(--shadow-sm); }
.btn-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn-row.tight { gap: 2px; flex-wrap: nowrap; }
input[type="text"], select, textarea {
  font: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: var(--r-sm); padding: 7px 11px; min-height: 36px; width: 100%; min-width: 0; box-shadow: var(--shadow-sm);
  transition: border-color .12s, box-shadow .12s;
}
textarea { resize: vertical; min-height: 84px; line-height: 1.55; }
input[type="text"]:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input:disabled, select:disabled, textarea:disabled { background: var(--surface-2); color: var(--muted); }
::placeholder { color: var(--muted); opacity: .8; }
.field { display: grid; gap: 6px; }
.field-label { font-size: 13px; font-weight: 600; color: var(--text-2); }
.field-hint { font-size: 12.5px; color: var(--muted); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-2); white-space: nowrap; user-select: none; }
.switch .track { width: 32px; height: 18px; border-radius: 99px; background: var(--surface-3); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(14px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Layout pieces ── */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head p { color: var(--muted); margin-top: 4px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); }
.panel + .panel { margin-top: 16px; }
.split > .panel { margin-top: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.panel-body { padding: 18px; }
.split { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
.sticky-side { position: sticky; top: 76px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
.chip svg { font-size: 13px; }
.chip.ok { background: var(--ok-soft); color: var(--ok-strong); border-color: var(--ok-line); }
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty .empty-ic { width: 48px; height: 48px; margin: 0 auto 12px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font-size: 22px; }
.empty h3 { color: var(--text); margin-bottom: 4px; }
.bar { height: 8px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; background: var(--ok); border-radius: 99px; transition: width .3s; }
.bar.sm { height: 6px; }

/* ── Setup ── */
.tpl-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; }
.tpl-bar .tpl-select { display: flex; align-items: center; gap: 10px; flex: 1 1 320px; min-width: 0; }
.tpl-bar select { max-width: 380px; font-weight: 600; }
.divider-v { width: 1px; height: 24px; background: var(--border); }
.hint-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; margin: 10px 2px 18px; }
.step-list { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px; }
.sl-item { border-radius: var(--r-sm); }
.sl-item.dragging { opacity: .4; }
.sl-item.drop-target { box-shadow: inset 0 2px 0 var(--accent); }
.sl-btn { width: 100%; display: grid; grid-template-columns: 14px 26px minmax(0, 1fr); align-items: center; gap: 8px; padding: 8px 10px 8px 6px; border: 0; border-radius: var(--r-sm);
  background: none; font: inherit; color: var(--text); text-align: left; cursor: pointer; }
.sl-btn:hover { background: var(--surface-2); }
.sl-item.on .sl-btn { background: var(--accent-soft); }
.sl-grip { color: var(--muted); font-size: 14px; cursor: grab; opacity: .6; }
.num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.sl-item.on .num { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.sl-text { min-width: 0; display: grid; }
.sl-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sl-title.untitled { color: var(--muted); font-style: italic; font-weight: 500; }
.sl-sub { font-size: 12px; color: var(--muted); }
.side-foot { padding: 10px; border-top: 1px solid var(--border); }
.side-foot .btn { width: 100%; }
.ed-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.ed-body { padding: 20px; display: grid; gap: 22px; }
.title-input { font-size: 17px !important; font-weight: 650; min-height: 42px !important; }
.ed-section { display: grid; gap: 10px; }
.ed-section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.ed-section-head h3 { display: flex; align-items: center; gap: 8px; }
.ed-section-head h3 svg { color: var(--muted); font-size: 16px; }
.count { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); border-radius: 99px; padding: 1px 8px; }
.te { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.te-main { display: grid; grid-template-columns: 24px minmax(0, 1fr) 190px auto auto; gap: 10px; align-items: center; padding: 10px 10px 10px 12px; }
.te-num { font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; }
.te-opts { border-top: 1px dashed var(--border); padding: 10px 12px 12px 46px; display: grid; gap: 6px; background: var(--surface-2); border-radius: 0 0 10px 10px; }
.opt { display: flex; align-items: center; gap: 8px; }
.opt-mark { color: var(--muted); width: 18px; display: grid; place-items: center; flex: none; font-size: 14px; }
.opt input { min-height: 32px; padding: 5px 10px; }
.le { display: grid; grid-template-columns: 32px minmax(0, 1fr) minmax(0, 1.6fr) auto; gap: 8px; align-items: center; }
.le-ic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font-size: 16px; }
.none-yet { font-size: 13px; color: var(--muted); padding: 4px 2px; }

/* ── Work: projects list ── */
.new-proj { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 12px; align-items: end; }
.pt { width: 100%; }
.pt-head, .pt-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(150px, 1.2fr) 150px 140px; gap: 16px; align-items: center; padding: 12px 18px; }
.pt-head { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); padding-top: 10px; padding-bottom: 10px; }
.pt-row { border-bottom: 1px solid var(--border); cursor: pointer; }
.pt-row:last-child { border-bottom: 0; }
.pt-row:hover { background: var(--surface-2); }
.pt-name { font-weight: 650; color: var(--text); background: none; border: 0; padding: 0; font: inherit; font-weight: 650; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.pt-sub { font-size: 12.5px; color: var(--muted); }
.pt-prog { display: grid; gap: 6px; }
.pt-prog-top { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
.pt-date { font-size: 13px; color: var(--text-2); }
.pt-actions { justify-self: end; }

/* ── Work: project view ── */
.crumb { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; padding: 4px 6px 4px 0; margin-bottom: 6px; }
.crumb:hover { color: var(--accent); }
.proj-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.proj-top h1 { overflow-wrap: anywhere; }
.proj-meta { color: var(--muted); margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.progress-card { margin: 18px 0 20px; padding: 14px 18px; display: grid; gap: 10px; }
.progress-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 650; }
.progress-top .pct { color: var(--muted); font-weight: 600; }
.done-banner { display: flex; align-items: center; gap: 14px; padding: 14px 18px; margin-bottom: 16px; border-radius: var(--r); background: var(--ok-soft); border: 1px solid var(--ok-line); color: var(--ok-strong); }
.done-banner .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: #fff; font-size: 20px; flex: none; }
.done-banner strong { display: block; font-size: 15px; }

/* Stepper (left) */
.stepper { list-style: none; margin: 0; padding: 10px; }
.sp-item { position: relative; }
.sp-item:not(:last-child)::before { content: ""; position: absolute; left: 25px; top: 40px; bottom: -6px; width: 2px; background: var(--border); border-radius: 2px; }
.sp-item.line-done::before { background: var(--ok); }
.sp-btn { width: 100%; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px; border: 0; border-radius: 10px; background: none;
  text-align: left; font: inherit; color: var(--text); cursor: pointer; position: relative; z-index: 1; }
.sp-btn:hover { background: var(--surface-2); }
.sp-item.sel .sp-btn { background: var(--accent-soft); }
.circle { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: var(--surface); border: 2px solid var(--border-strong); color: var(--muted); }
.circle svg { font-size: 16px; }
.s-done .circle { background: var(--ok); border-color: var(--ok); color: #fff; }
.s-current .circle { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); background: var(--surface); }
.s-open .circle { border-color: var(--warn); color: var(--warn); }
.s-locked .circle { border-style: dashed; color: var(--muted); }
.sp-text { min-width: 0; display: grid; }
.sp-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-locked .sp-title { color: var(--muted); }
.sp-sub { font-size: 12px; color: var(--muted); }
.s-done .sp-sub { color: var(--ok-strong); }
.sp-more { padding: 6px 8px 2px; }
.add-preview { display: inline-flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 1px dashed var(--border-strong); border-radius: 10px; background: none;
  color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
.add-preview:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.add-preview .plus { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; border: 2px dashed currentColor; font-size: 16px; flex: none; }
.locked-count { font-size: 12px; color: var(--muted); padding: 8px 10px 4px; }

/* Step panel (right) */
.step-panel { overflow: hidden; }
.step-panel.preview { border-style: dashed; }
.hero { padding: 20px 24px; border-bottom: 1px solid var(--border); }
.hero-row { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
.hero-row h2 { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tick { width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--border-strong); flex: none; display: grid; place-items: center; color: transparent; font-size: 16px; cursor: default; }
.tick.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.locked-note { display: flex; align-items: center; gap: 10px; margin: 16px 24px 0; padding: 10px 14px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 13px; }
.instruction { display: flex; gap: 12px; margin: 18px 24px 0; padding: 12px 16px; border-radius: var(--r-sm); background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--text-2); }
.instruction svg { color: var(--accent); font-size: 18px; margin-top: 1px; }
.instruction .t { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-bottom: 2px; }
.instruction p { white-space: pre-wrap; overflow-wrap: anywhere; }
.sec { padding: 20px 24px 4px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.sec-head h3 { display: flex; align-items: center; gap: 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); }
.sec-head h3 svg { font-size: 16px; color: var(--muted); }
.sec-meta { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.sec-meta.ok { color: var(--ok-strong); }

.checklist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.ci { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; padding: 14px 16px; border-top: 1px solid var(--border); background: var(--surface); transition: background .15s; }
.ci:first-child { border-top: 0; }
.ci.done { background: var(--ok-soft); background: color-mix(in srgb, var(--ok-soft) 45%, var(--surface)); }
.ci-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border-strong); display: grid; place-items: center; color: transparent; font-size: 13px; margin-top: 1px; }
.ci.done .ci-dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.ci-body { display: grid; gap: 10px; min-width: 0; }
.ci-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ci-label { font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
.req { font-size: 11px; font-weight: 700; color: var(--danger); background: var(--danger-soft); border-radius: 4px; padding: 0 6px; line-height: 18px; text-transform: uppercase; letter-spacing: .03em; }
.ci.check { padding: 0; }
.ci-check { grid-column: 1 / -1; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; align-items: center; padding: 14px 16px; cursor: pointer; }
.ci-check:hover { background: var(--surface-2); }
.ci.done .ci-check:hover { background: transparent; }
.box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border-strong); display: grid; place-items: center; color: transparent; font-size: 14px; background: var(--surface); transition: all .12s; }
.ci-check input:checked + .box { background: var(--ok); border-color: var(--ok); color: #fff; }
.ci-check input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
.ci.ro .ci-check { cursor: default; }
.ci.done .ci-check .ci-label { color: var(--text-2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.opt-chip { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 5px 14px 5px 10px; border: 1px solid var(--border-strong); border-radius: 99px;
  background: var(--surface); color: var(--text-2); font-weight: 500; cursor: pointer; user-select: none; transition: all .12s; box-shadow: var(--shadow-sm); }
.opt-chip:hover { border-color: var(--accent); }
.opt-chip .mk { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--border-strong); display: grid; place-items: center; font-size: 11px; color: transparent; flex: none; }
.opt-chip .mk.round { border-radius: 50%; }
.opt-chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.opt-chip.on .mk { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.opt-chip.on .mk.round { box-shadow: inset 0 0 0 3px var(--accent-soft); }
.opt-chip:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.ci.ro .opt-chip { cursor: default; opacity: .75; }
.ci-select { max-width: 360px; }
.ci-text { max-width: 520px; }
.mt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.mt-grid .field-label { font-size: 12px; color: var(--muted); }
.linkish { border: 0; background: none; padding: 0; color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer; text-decoration: underline; justify-self: start; }

.res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.res { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text);
  text-decoration: none; min-width: 0; transition: border-color .12s, box-shadow .12s; }
a.res:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.res-ic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; font-size: 18px; flex: none; }
.res-ic.doc { background: var(--accent-soft); color: var(--accent); }
.res-ic.form { background: var(--warn-soft); color: var(--warn); }
.res-text { display: grid; min-width: 0; flex: 1; }
.res-label { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-kind { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-go { color: var(--muted); font-size: 15px; }
a.res:hover .res-go { color: var(--accent); }

.step-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 24px; margin-top: 20px; border-top: 1px solid var(--border); background: var(--surface-2); flex-wrap: wrap; }
.foot-hint { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }

/* ── Summary ── */
.sum-toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; margin-bottom: 16px; }
.sum-toolbar select { max-width: 360px; font-weight: 600; }
.sum-doc { padding: 28px 32px; }
.sum-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin: 18px 0; padding: 16px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.sum-facts dt { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.sum-facts dd { margin: 2px 0 0; font-weight: 600; overflow-wrap: anywhere; }
.sum-step { padding: 18px 0; border-bottom: 1px solid var(--border); break-inside: avoid; }
.sum-step:last-child { border-bottom: 0; padding-bottom: 0; }
.sum-step-head { display: flex; align-items: center; gap: 12px; }
.sum-step-head h3 { flex: 1; min-width: 0; font-size: 15px; overflow-wrap: anywhere; }
.sum-step-head .circle { width: 28px; height: 28px; font-size: 12px; }
.sum-answers { margin: 12px 0 0 40px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; font-size: 13.5px; }
.sum-answers > div { padding: 8px 12px; border-top: 1px solid var(--border); }
.sum-answers > div:nth-child(-n+2) { border-top: 0; }
.sum-answers .q { color: var(--text-2); background: var(--surface-2); }
.sum-answers .a { font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
.sum-answers .a.none { color: var(--muted); font-weight: 400; }
.sum-note { margin: 10px 0 0 40px; padding: 10px 14px; border-radius: var(--r-sm); background: var(--surface-2); border-left: 3px solid var(--accent); white-space: pre-wrap; overflow-wrap: anywhere; }
.sum-note .t { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 2px; white-space: normal; }
.sum-note.none { border-left-color: var(--border-strong); color: var(--muted); }

/* ── Footer, toasts, dialogs ── */
.footer { max-width: 1240px; margin: 0 auto; padding: 8px 24px 32px; color: var(--muted); font-size: 12.5px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.footer span { display: inline-flex; gap: 8px; align-items: center; }
#toasts { position: fixed; bottom: 20px; right: 20px; z-index: 60; display: grid; gap: 8px; width: min(400px, calc(100% - 32px)); }
.toast { display: flex; align-items: center; gap: 10px; padding: 12px 8px 12px 14px; border-radius: 10px; background: var(--text); color: var(--bg); box-shadow: var(--shadow-lg); font-size: 13.5px; font-weight: 500; animation: tin .18s ease-out; }
.toast > span { flex: 1; }
.toast .ti { font-size: 18px; flex: none; }
.toast.ok .ti { color: var(--ok); }
.toast.error { background: var(--danger); color: #fff; }
.toast .icon-btn { color: inherit; opacity: .7; }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
dialog.modal { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text); padding: 22px; width: min(440px, calc(100% - 32px)); box-shadow: var(--shadow-lg); }
dialog.modal::backdrop { background: rgba(16,24,40,.5); backdrop-filter: blur(2px); }
dialog.modal h2 { font-size: 17px; }
dialog.modal p { margin: 10px 0 0; color: var(--text-2); white-space: pre-line; overflow-wrap: anywhere; }
dialog.modal .field { margin-top: 14px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; margin-top: 20px; }

/* ── Responsive ── */
@media (max-width: 900px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .sticky-side { position: static; }
  .stepper { display: flex; gap: 6px; overflow-x: auto; padding: 8px; scroll-snap-type: x proximity; }
  .sp-item { flex: 0 0 auto; scroll-snap-align: start; }
  .sp-item::before { display: none; }
  .sp-btn { grid-template-columns: 28px auto; gap: 8px; padding: 6px 10px 6px 6px; max-width: 200px; }
  .circle { width: 28px; height: 28px; }
  .sp-sub { display: none; }
  .sp-more { padding: 0; display: flex; align-items: center; }
  .add-preview { width: auto; white-space: nowrap; padding: 6px 12px 6px 6px; }
  .add-preview .plus { width: 28px; height: 28px; }
  .locked-count { display: none; }
  .step-list { max-height: 260px; overflow-y: auto; }
  .pt-head { display: none; }
  .pt-row { grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; }
  .pt-prog { grid-column: 1 / -1; grid-row: 2; }
  .pt-date { display: none; }
  .pt-actions { grid-row: 1; grid-column: 2; }
}
@media (max-width: 640px) {
  .appbar-in { padding: 0 12px; gap: 8px; }
  .brand span:last-child { display: none; }
  .nav-tab { padding: 0 8px; gap: 6px; }
  .appbar-right { gap: 2px; }
  .saved .txt { display: none; }
  .container { padding: 16px; }
  .footer { padding: 8px 16px 24px; }
  .hero, .sec { padding-left: 16px; padding-right: 16px; }
  .instruction, .locked-note { margin-left: 16px; margin-right: 16px; }
  .step-foot { padding: 14px 16px; }
  .step-foot .btn { flex: 1; }
  .foot-hint { order: -1; width: 100%; justify-content: center; }
  .new-proj { grid-template-columns: 1fr; }
  .te-main { grid-template-columns: 24px minmax(0, 1fr) auto; }
  .te-main > select { grid-column: 2 / -1; }
  .te-main > .switch { grid-column: 2; }
  .te-opts { padding-left: 12px; }
  .le { grid-template-columns: 32px minmax(0, 1fr) auto; }
  .le > input:nth-of-type(2) { grid-column: 2 / -1; }
  .sum-doc { padding: 20px 16px; }
  .sum-answers, .sum-note { margin-left: 0; }
  .sum-answers { grid-template-columns: 1fr; }
  .sum-answers > div:nth-child(2) { border-top: 1px solid var(--border); }
  .sum-answers .a { border-top: 0 !important; padding-top: 0; }
  .sum-answers .q { background: none; font-size: 12.5px; color: var(--muted); padding-bottom: 2px; }
  .page-head h1 { font-size: 20px; }
}
@media (max-width: 400px) {
  .nav-tab svg { display: none; }
}
@media print {
  .no-print, .banner, #toasts, dialog { display: none !important; }
  body { background: #fff; color: #000; }
  .container { max-width: none; padding: 0; }
  .panel { box-shadow: none; border: 0; }
  .sum-doc { padding: 0; }
}
</style>
</head>
<body>
<header class="appbar no-print">
  <div class="appbar-in">
    <div class="brand"><span class="logo" data-icon="steps"></span><span>Step Workflow</span></div>
    <nav class="nav" role="tablist" aria-label="Pages">
      <button class="nav-tab" role="tab" id="tab-setup" aria-controls="page-setup"><span data-icon="sliders"></span><span>Setup</span></button>
      <button class="nav-tab" role="tab" id="tab-work" aria-controls="page-work"><span data-icon="checks"></span><span>Work</span></button>
      <button class="nav-tab" role="tab" id="tab-summary" aria-controls="page-summary"><span data-icon="list"></span><span>Summary</span></button>
    </nav>
    <div class="appbar-right">
      <span class="saved" id="saved" aria-live="polite"></span>
      <button class="icon-btn" id="themeBtn"></button>
    </div>
  </div>
</header>
<div id="storageWarn" class="banner warn no-print" role="alert" hidden></div>
<main class="container">
  <div id="page-setup" role="tabpanel" aria-labelledby="tab-setup"></div>
  <div id="page-work" role="tabpanel" aria-labelledby="tab-work" hidden></div>
  <div id="page-summary" role="tabpanel" aria-labelledby="tab-summary" hidden></div>
</main>
<footer class="footer no-print">
  <span><span data-icon="shield"></span>Private: no network requests. Your data stays in this browser and in files you save.</span>
  <button class="btn sm ghost danger" id="clearAll">Clear all data in this browser</button>
</footer>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="fileSetup" accept=".json,application/json" hidden>
<input type="file" id="fileProject" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';

/* ───────────── Constants & small helpers ───────────── */
const SCHEMA = 1;
const KIND_SETUP = 'step-workflow-setup';
const KIND_PROJECT = 'step-workflow-project';
const LS = { setups: 'sw.setups', active: 'sw.activeSetupId', projects: 'sw.projects', ui: 'sw.ui' };
const TYPES = { checkbox: 'Checkbox', multi: 'Multiple checkboxes', single: 'Single choice', dropdown: 'Dropdown', text: 'Short text', multitext: 'Multiple short text' };
const MAX_FILE = 5 * 1024 * 1024;
const isChoice = t => t === 'multi' || t === 'single' || t === 'dropdown';
const hasOptions = t => isChoice(t) || t === 'multitext'; // multitext: options are the labels of its text boxes

const $ = s => document.querySelector(s);
const now = () => new Date().toISOString();
const clone = o => JSON.parse(JSON.stringify(o));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const arr = v => Array.isArray(v) ? v : [];
const str = (v, max = 2000) => typeof v === 'string' ? v.slice(0, max) : (typeof v === 'number' && isFinite(v) ? String(v) : '');
const validDate = v => (typeof v === 'string' && !isNaN(Date.parse(v))) ? new Date(v).toISOString() : null;
const move = (a, from, to) => { if (to < 0 || to >= a.length || from === to) return; a.splice(to, 0, a.splice(from, 1)[0]); };
const fileSafe = s => (str(s, 120).replace(/[\\/:*?"<>|\u0000-\u001f]+/g, '_').replace(/^\.+/, '').trim()) || 'untitled';

function fmtTime(d) {
  try { return new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
}
function fmtDateTime(d) {
  try { return new Date(d).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return String(d || ''); }
}

// DOM builder. User text only ever goes in via textContent / properties, never innerHTML.
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  let value;
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'value') value = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (k === 'checked' || k === 'disabled' || k === 'selected') e[k] = !!v;
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else e.setAttribute(k, v === true ? '' : String(v));
  }
  append(e, kids);
  if (value !== undefined) e.value = value; // after children so <select> options exist
  return e;
}
function append(e, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
}
const btn = (label, fn, cls = '', attrs = {}) => h('button', Object.assign({ class: 'btn ' + cls, type: 'button', onclick: fn }, attrs), label);

/* ───────────── Storage (always try/catch) ───────────── */
let storageOk = true;
let lastSetupSaved = null, lastProjectSaved = null;

function lsRead(key) {
  let raw;
  try { raw = localStorage.getItem(key); } catch (e) { storageFailed(); return undefined; }
  if (raw == null) return undefined;
  try { return JSON.parse(raw); } catch (e) { toast(`Saved browser data (${key}) was damaged and has been ignored.`, 'error'); return undefined; }
}
function lsWrite(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e) { storageFailed(e && e.name === 'QuotaExceededError'); return false; }
}
function storageFailed(full) {
  storageOk = false;
  const w = $('#storageWarn');
  if (!w) return;
  w.textContent = (full ? 'Browser storage is full. ' : 'Browser storage is unavailable (private mode or blocked). ') +
    'Changes are NOT saved in this browser — use "Export setup" and "Save project" to keep your work.';
  w.hidden = false;
}
function updateSaved() {
  const e = $('#saved');
  if (!e) return;
  const d = [lastSetupSaved, lastProjectSaved].filter(Boolean).sort((x, y) => y - x)[0];
  e.classList.toggle('bad', !storageOk);
  e.replaceChildren(icon(storageOk ? 'check' : 'alert'),
    h('span', { class: 'txt' }, storageOk ? (d ? `Saved ${fmtTime(d)}` : 'Saved') : 'Not saved'));
  e.title = storageOk ? 'All changes are saved in this browser' : 'Browser storage is unavailable';
}
function saveSetups() {
  const ok = lsWrite(LS.setups, state.setups) & lsWrite(LS.active, state.activeSetupId);
  if (ok) lastSetupSaved = new Date();
  updateSaved();
}
function saveProjects() {
  if (lsWrite(LS.projects, state.projects)) lastProjectSaved = new Date();
  updateSaved();
}
function saveUi() { lsWrite(LS.ui, state.ui); }

/* ───────────── Validation / normalisation ───────────── */
function checkVersion(v) {
  if (v == null) return; // very old / hand-made file: accept and upgrade
  const n = Number(v);
  if (!isFinite(n)) throw new Error('The file has an invalid "schemaVersion".');
  if (n > SCHEMA) throw new Error(`This file was made by a newer version of Step Workflow (schema ${n}). This app understands schema ${SCHEMA}.`);
}
function normTemplate(raw) {
  if (!isObj(raw)) throw new Error('This is not a Step Workflow setup file.');
  if (raw.kind === KIND_PROJECT) throw new Error('This is a project file. Open it on the Work page with "Open project file".');
  if (raw.kind != null && raw.kind !== KIND_SETUP) throw new Error('This is not a Step Workflow setup file.');
  checkVersion(raw.schemaVersion);
  if (!Array.isArray(raw.steps)) throw new Error('The setup has no "steps" list.');
  const ids = new Set();
  const uniq = (id, p) => { id = str(id, 64); if (!id || ids.has(id)) id = uid(p); ids.add(id); return id; };
  const link = (l, p) => ({ id: uniq(l.id, p), label: str(l.label, 300), url: str(l.url, 2000) });
  return {
    kind: KIND_SETUP,
    schemaVersion: SCHEMA,
    id: str(raw.id, 64) || uid('tpl'),
    name: str(raw.name, 200).trim() || 'Untitled setup',
    updatedAt: validDate(raw.updatedAt) || now(),
    steps: raw.steps.filter(isObj).slice(0, 500).map(s => ({
      id: uniq(s.id, 'st'),
      topic: str(s.topic, 300),
      note: str(s.note, 5000),
      todos: arr(s.todos).filter(isObj).slice(0, 500).map(t => ({
        id: uniq(t.id, 'td'),
        label: str(t.label, 500),
        type: Object.prototype.hasOwnProperty.call(TYPES, t.type) ? t.type : 'checkbox',
        required: t.required === true,
        options: [...new Set(arr(t.options).map(o => str(o, 300)).filter(o => o.trim() !== ''))].slice(0, 200)
      })),
      docs: arr(s.docs).filter(isObj).slice(0, 200).map(l => link(l, 'dl')),
      forms: arr(s.forms).filter(isObj).slice(0, 200).map(l => link(l, 'fl'))
    }))
  };
}
function normAnswers(step, raw) {
  raw = isObj(raw) ? raw : {};
  const out = {};
  for (const t of step.todos) {
    const v = raw[t.id];
    if (t.type === 'checkbox') out[t.id] = v === true;
    else if (t.type === 'multi') out[t.id] = Array.isArray(v) ? t.options.filter(o => v.includes(o)) : [];
    else if (t.type === 'text') out[t.id] = str(v, 5000);
    else if (t.type === 'multitext') out[t.id] = t.options.map((_, k) => str(arr(v)[k], 5000));
    else out[t.id] = (typeof v === 'string' && t.options.includes(v)) ? v : '';
  }
  return out;
}
function normProject(raw) {
  if (!isObj(raw)) throw new Error('This is not a Step Workflow project file.');
  if (raw.kind === KIND_SETUP) throw new Error('This is a setup file. Import it on the Setup page with "Import setup".');
  if (raw.kind != null && raw.kind !== KIND_PROJECT) throw new Error('This is not a Step Workflow project file.');
  checkVersion(raw.schemaVersion);
  if (!isObj(raw.template)) throw new Error('The project file does not contain its setup template.');
  let template;
  try { template = normTemplate(raw.template); }
  catch (e) { throw new Error('The setup inside the project file is invalid: ' + e.message); }
  if (!template.steps.length) throw new Error("The project's setup has no steps.");
  const rs = isObj(raw.steps) ? raw.steps : {};
  const steps = {};
  template.steps.forEach(s => {
    const x = isObj(rs[s.id]) ? rs[s.id] : {};
    steps[s.id] = {
      answers: normAnswers(s, x.answers),
      note: str(x.note, 20000),
      status: ['locked', 'active', 'done'].includes(x.status) ? x.status : 'locked',
      completedAt: validDate(x.completedAt)
    };
  });
  let r = Number.isInteger(raw.revealedUpTo) ? raw.revealedUpTo : -1;
  if (r < 0) template.steps.forEach((s, i) => { if (steps[s.id].status !== 'locked') r = i; }); // infer for older files
  const p = {
    kind: KIND_PROJECT,
    schemaVersion: SCHEMA,
    id: str(raw.id, 64) || uid('prj'),
    name: str(raw.name, 200).trim() || 'Untitled project',
    createdAt: validDate(raw.createdAt) || now(),
    updatedAt: validDate(raw.updatedAt) || now(),
    completedAt: validDate(raw.completedAt),
    template,
    revealedUpTo: Math.max(0, Math.min(r, template.steps.length - 1)),
    steps
  };
  recompute(p);
  return p;
}
function dedupeIds(list, prefix) {
  const seen = new Set();
  for (const x of list) { if (seen.has(x.id)) x.id = uid(prefix); seen.add(x.id); }
}

/* ───────────── Progress logic ───────────── */
function todoDone(t, a) {
  switch (t.type) {
    case 'checkbox': return a === true;
    case 'multi': return Array.isArray(a) && a.length > 0;
    case 'multitext': return Array.isArray(a) && a.length > 0 && a.every(x => typeof x === 'string' && x.trim() !== '');

const stepComplete = (step, st) => step.todos.every(t => !t.required || todoDone(t, st.answers[t.id]));

  let r = Math.max(0, Math.min(p.revealedUpTo | 0, n - 1));
  while (r < n - 1 && stepComplete(steps[r], p.steps[steps[r].id])) r++; // auto-unlock next step
  p.revealedUpTo = r;
  steps.forEach((s, i) => {
    const st = p.steps[s.id];
    const done = i <= r && stepComplete(s, st);
    st.status = i > r ? 'locked' : done ? 'done' : 'active';
    if (done && !st.completedAt) st.completedAt = ts;
    if (!done) st.completedAt = null;
  });
  const all = n > 0 && steps.every(s => p.steps[s.id].status === 'done');
  if (all && !p.completedAt) p.completedAt = ts;
  if (!all) p.completedAt = null;
}

function modal({ title, message, input, buttons }) {
  return new Promise(resolve => {
    let finished = false;
    const inp = input ? h('input', { type: 'text', value: input.value || '', autocomplete: 'off', spellcheck: 'false', 'aria-label': input.label }) : null;
    const finish = v => {
      if (finished) return;

      try { dlg.close(); } catch (e) { /* ignore */ }
      dlg.remove();
      resolve(v);
    };
    const pick = b => finish(b.value == null ? null : { button: b.value, value: inp ? inp.value : null });
    const main = buttons.find(b => /primary|solid/.test(b.cls || ''));
    const dlg = h('dialog', { class: 'modal', 'aria-label': title },

      h('div', { class: 'modal-actions' }, buttons.map(b => btn(b.label, () => pick(b), b.cls || ''))));
    if (inp && main) inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); pick(main); } });
    dlg.addEventListener('cancel', e => { e.preventDefault(); finish(null); });
    document.body.append(dlg);
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    if (inp) { inp.focus(); inp.select(); } else (dlg.querySelector('.primary,.solid') || dlg.querySelector('button')).focus();
  });
}

    h('div', { class: 'ed-head' },
      h('div', { class: 'eyebrow' }, `Step ${i + 1} of ${n}`),
      h('div', { class: 'btn-row tight' },
        ibtn('up', 'Move step up', () => mutate(() => move(tpl.steps, i, i - 1)), i === 0),
        ibtn('down', 'Move step down', () => mutate(() => move(tpl.steps, i, i + 1)), i === n - 1),
        ibtn('trash', 'Delete step', async () => {
